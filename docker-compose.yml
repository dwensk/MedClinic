services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medklinik
      POSTGRES_PASSWORD: medklinik
      POSTGRES_DB: medklinik
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medklinik"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://medklinik:medklinik@db:5432/medklinik
      APP_NAME: "МедКлиник API"
      DEBUG: "True"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
